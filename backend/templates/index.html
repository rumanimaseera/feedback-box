<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Feedback Box</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Submit Feedback</a>
            <a href="/admin">Admin Dashboard</a>
        </div>
        
        <h1>Share Your Thoughts</h1>
        
        <div class="feedback-form">
            <p style="margin-bottom: 1rem; color: #6b7280;">Your feedback is completely anonymous. Be honest and constructive!</p>
            
            <form id="feedbackForm">
                <textarea id="feedbackText" placeholder="Write your feedback here..." required></textarea>
                <button type="submit" id="submitBtn">Submit Feedback</button>
            </form>
            
            <div id="statusMessage" class="message"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
